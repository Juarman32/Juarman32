<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Juarman — sysadmin, homelab, ciberseguridad, IA local">
  <title>Juarman — sysadmin · homelab · ciberseguridad · IA local</title>

  <defs>
    <radialGradient id="haze" cx="72%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#1A2233" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0D1220" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07080B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="nameClip">
      <text x="72" y="170" font-size="66" font-weight="300" letter-spacing="11" class="sans">JUARMAN</text>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }

      .sweep { animation: sweep 13s cubic-bezier(.45,0,.3,1) infinite; }
      @keyframes sweep { 0%, 62% { transform: translateX(-260px); } 82%, 100% { transform: translateX(760px); } }

      .packet { animation: packet 9s cubic-bezier(.45,0,.55,1) infinite alternate; }
      @keyframes packet { from { transform: translateY(0); } to { transform: translateY(148px); } }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#07080B"/>
  <rect width="1200" height="400" fill="url(#haze)"/>

  <!-- marco -->
  <rect x="24.5" y="24.5" width="1151" height="351" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.075"/>
  <path d="M24.5 60V34.5a10 10 0 0 1 10-10H60" fill="none" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="1.2"/>
  <path d="M1140 365.5h25.5a10 10 0 0 0 10-10V330" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>

  <!-- etiqueta -->
  <circle cx="76" cy="92" r="3" fill="#00E5FF"/>
  <text class="mono" x="91" y="97" font-size="13" fill="#7C8598" letter-spacing="2.8">SYSADMIN · SELF-HOSTED</text>

  <!-- nombre -->
  <text class="sans" x="72" y="170" font-size="66" font-weight="300" letter-spacing="11" fill="#F2F5F9">JUARMAN<tspan class="mono" dx="18" font-size="29" font-weight="500" letter-spacing="2" fill="#00E5FF">32</tspan></text>
  <g clip-path="url(#nameClip)"><rect class="sweep" x="-160" y="100" width="150" height="90" fill="url(#sweep)" transform="skewX(-16)"/></g>

  <!-- regla -->
  <line x1="72" y1="200" x2="574" y2="200" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <line x1="72" y1="200" x2="176" y2="200" stroke="#00E5FF" stroke-opacity="0.85" stroke-width="1.4"/>

  <!-- subtitulo -->
  <text class="mono" x="72" y="231" font-size="13" fill="#8A93A4" letter-spacing="3.9">INFRAESTRUCTURA · AUTOMATIZACIÓN · CIBERSEGURIDAD</text>

  <!-- frase -->
  <text class="serif" x="72" y="272" font-size="18" font-style="italic" fill="#97A0B2">«Si no lo puedo medir, no lo puedo arreglar.»</text>

  <!-- ficha derecha -->
  <g>
    <line x1="900" y1="120" x2="900" y2="290" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <line x1="896.5" y1="290" x2="903.5" y2="290" stroke="#FFFFFF" stroke-opacity="0.20"/>

    <g class="mono" font-size="12.5" letter-spacing="1.8" fill="#7C8598">
      <text x="920" y="124">proxmox</text>
      <text x="920" y="180">docker</text>
      <text x="920" y="236">hermes</text>
      <text x="920" y="292">ia local</text>
    </g>

    <g fill="#0A0C12" stroke="#FFFFFF" stroke-opacity="0.28">
      <circle cx="900" cy="120" r="3.2"/>
      <circle cx="900" cy="176" r="3.2"/>
      <circle cx="900" cy="232" r="3.2"/>
      <circle cx="900" cy="288" r="3.2"/>
    </g>
    <circle cx="900" cy="120" r="3.2" fill="#00E5FF" stroke="none"/>

    <!-- paquete -->
    <g class="packet">
      <circle cx="900" cy="138" r="2.4" fill="#00E5FF"/>
      <rect x="899.2" y="114" width="1.6" height="26" fill="url(#packet)"/>
    </g>
  </g>

  <!-- pie -->
  <text class="mono" x="72" y="338" font-size="11.5" fill="#5F6879" letter-spacing="2">MEDITERRÁNEO · UTC+1</text>
  <text class="mono" x="1128" y="338" font-size="11.5" fill="#5F6879" letter-spacing="2" text-anchor="end">GITHUB.COM/JUARMAN32</text>
</svg>
